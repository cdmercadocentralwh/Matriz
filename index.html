<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Matriz de Habilidades CD</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: sticky control bar (mes + turno + búsqueda), tab rail estilo cartel de pasillo, vistas en grilla; ficha de persona como panel lateral / hoja inferior */
:root{
  --bg:#0a1526; --panel:#111f38; --panel2:#172947; --line:#233a60; --fg:#e8edf6; --muted:#8fa0bd;
  --gold:#f0ad2e; --gold-ink:#1a1206; --info:#6aa8e8; --ok:#3bb273; --warn:#e8793a; --bad:#e5484d; --na:#2a3b5c; --na-fg:#8fa0bd;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#eef1f6; --panel:#ffffff; --panel2:#f5f7fb; --line:#d5dce8; --fg:#0e1b31; --muted:#56657f;
  --gold:#c98a0c; --gold-ink:#ffffff; --info:#2f6fb3; --ok:#1f8a55; --warn:#c75a1d; --bad:#c4282d; --na:#e3e8f0; --na-fg:#6b7891; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#eef1f6; --panel:#ffffff; --panel2:#f5f7fb; --line:#d5dce8; --fg:#0e1b31; --muted:#56657f;
  --gold:#c98a0c; --gold-ink:#ffffff; --info:#2f6fb3; --ok:#1f8a55; --warn:#c75a1d; --bad:#c4282d; --na:#e3e8f0; --na-fg:#6b7891; color-scheme:light}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--panel)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1320px;margin:0 auto}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.mark{width:34px;height:34px;border-radius:7px;background:var(--gold);color:var(--gold-ink);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.02em;flex:none}
.brand h1{font-family:var(--display);font-weight:700;font-size:21px;line-height:1.05;margin:0;letter-spacing:.01em;text-transform:uppercase}
.brand h1 span{color:var(--gold)}
.brand small{display:block;color:var(--muted);font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sel{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.chips{display:flex;gap:4px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:3px;flex-wrap:wrap}
.chip{border:0;background:transparent;padding:5px 10px;border-radius:6px;font-weight:600;font-size:13px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink)}
.search{position:relative}
.search input{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:210px;max-width:100%}
.btn{border:1px solid var(--gold);background:transparent;color:var(--gold);border-radius:8px;padding:7px 12px;font-weight:600;font-size:13px}
.btn.solid{background:var(--gold);color:var(--gold-ink)}

nav.tabs{display:flex;gap:6px;overflow-x:auto;padding-block:0 10px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;text-decoration:none;color:var(--muted);font-family:var(--display);font-weight:600;font-size:16px;text-transform:uppercase;letter-spacing:.04em;padding:6px 12px 6px 10px;border-radius:7px;border:1px solid transparent;display:flex;gap:8px;align-items:center}
.tab b{font-size:12px;min-width:22px;height:20px;border-radius:4px;display:grid;place-items:center;background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.tab:hover{color:var(--fg)}
.tab[aria-current="page"]{color:var(--fg);border-color:var(--line);background:var(--panel2)}
.tab[aria-current="page"] b{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}

.note{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:16px;padding:10px 14px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);font-size:13px}
.note strong{color:var(--fg)}
main{padding-block:16px 60px}
.view-h{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:8px 0 14px}
.view-h h2{font-family:var(--display);font-size:30px;font-weight:700;text-transform:uppercase;letter-spacing:.01em;margin:0;line-height:1}
.view-h p{margin:4px 0 0;color:var(--muted);max-width:68ch}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.kpi .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.kpi .val{font-family:var(--display);font-weight:700;font-size:44px;line-height:1;margin-top:6px}
.kpi .sub{font-size:13px;color:var(--muted);margin-top:6px}
.kpi.pick{text-align:left;cursor:pointer;font:inherit;color:inherit;display:flex;flex-direction:column;justify-content:flex-start}
.kpi.pick:hover{border-color:var(--gold)}
.kpi.pick[aria-pressed="true"],.kpi.hero{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.kpi.pick[aria-pressed="true"] .lbl,.kpi.pick[aria-pressed="true"] .sub,.kpi.hero .lbl,.kpi.hero .sub{color:var(--gold-ink);opacity:.8}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:12px}
.grid2.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
@media (max-width:860px){.grid2,.grid2.even{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.card h3{font-family:var(--display);font-weight:600;font-size:18px;text-transform:uppercase;letter-spacing:.04em;margin:0 0 10px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.card h3 small{font-family:var(--body);text-transform:none;letter-spacing:0;color:var(--muted);font-weight:400;font-size:13px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
svg text{fill:var(--muted);font-family:var(--body);font-size:11px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;font-weight:600;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--panel)}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--panel2)}
.tblwrap{max-height:520px;overflow:auto}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
.p-ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.p-warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.p-bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.p-gold{background:color-mix(in srgb,var(--gold) 20%,transparent);color:var(--gold)}
.p-mut{background:var(--na);color:var(--na-fg)}
.p-info{background:color-mix(in srgb,var(--info) 20%,transparent);color:var(--info)}
.aj{font-size:12px;color:var(--info);margin-top:2px}
.strip{display:flex;gap:2px}
.strip i{width:7px;height:16px;border-radius:2px;background:var(--na);flex:none}
.strip i.EA{background:var(--ok)} .strip i.TA{background:var(--gold)} .strip i.TS{background:var(--bad)}
.strip.big i{width:auto;flex:1;height:22px;min-width:3px}
.muted{color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.empty{padding:24px;text-align:center;color:var(--muted)}
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:9px;background:var(--panel2);border:1px solid var(--line)}
.alert .dot{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:none}
.alert b{display:block}
.alert .muted{font-size:13px}
.linkish{background:none;border:0;padding:0;color:var(--gold);font-weight:600;text-decoration:underline;text-underline-offset:2px}

/* Matriz */
.mx{border-collapse:separate;border-spacing:3px;width:auto}
.mx th{position:sticky;top:0;background:var(--panel);z-index:2;border:0;padding:4px 2px;vertical-align:bottom}
.mx th.tk{height:120px;width:30px}
.mx th.tk span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:11px;letter-spacing:.02em;text-transform:none;white-space:nowrap;cursor:pointer}
.mx th.tk span:hover{color:var(--gold)}
.mx td{border:0;padding:0}
.mx td.nm{position:sticky;left:0;background:var(--panel);z-index:1;padding:0 10px 0 0;white-space:nowrap;font-size:13px;cursor:pointer;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.mx td.nm:hover{color:var(--gold)}
.mx td.pc{padding-left:8px;font-size:12px;white-space:nowrap}
.c{width:30px;height:24px;border-radius:4px;display:block}
.c0{background:var(--ok)} .c1{background:var(--warn)} .c2{background:var(--na)}
.c.dim{opacity:.25}

.taskgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.task{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.task:hover,.task[aria-pressed="true"]{border-color:var(--gold)}
.task .t{font-weight:600}
.task .n{font-family:var(--display);font-size:34px;font-weight:700;line-height:1}
.meter{height:6px;border-radius:9px;background:var(--na);overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok);border-radius:9px}
.meter.gold i{background:var(--gold)}

.hbar{display:grid;grid-template-columns:120px minmax(0,1fr) 46px;gap:8px;align-items:center;font-size:13px;margin:6px 0}
.hbar .tr{height:14px;background:var(--na);border-radius:4px;overflow:hidden}
.hbar .tr i{display:block;height:100%;background:var(--gold)}
.pickbar{width:100%;border:1px solid transparent;background:none;text-align:left;border-radius:7px;padding:3px 6px;margin:2px 0}
.pickbar:hover{border-color:var(--line)}
.pickbar[aria-pressed="true"]{border-color:var(--gold);background:var(--panel2)}
.pickbar .tr{display:block}

/* Ficha */
.scrim{position:fixed;inset:0;background:rgba(3,8,18,.55);z-index:40}
aside.ficha{position:fixed;z-index:41;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:calc(16px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 18px;display:flex;flex-direction:column;gap:14px}
@media (max-width:600px){aside.ficha{top:auto;max-height:88vh;border-left:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;padding-left:max(16px,env(safe-area-inset-left,0px))}}
.ficha h2{font-family:var(--display);font-size:28px;margin:0;line-height:1.05;text-transform:uppercase}
.ficha .close{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:4px 10px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fact{background:var(--panel2);border-radius:9px;padding:8px 10px;min-width:0}
.fact .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.fact .v{font-family:var(--display);font-size:22px;font-weight:600;overflow-wrap:anywhere}
.tchips{display:flex;flex-wrap:wrap;gap:5px}
.tchip{font-size:12px;padding:3px 8px;border-radius:6px;border:1px solid var(--line)}
.tchip.s0{border-color:var(--ok);color:var(--ok)} .tchip.s1{border-color:var(--warn);color:var(--warn)} .tchip.s2{color:var(--na-fg);background:var(--na);border-color:transparent}
.sec-t{font-family:var(--display);font-size:16px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 6px}
.nok{font-size:13px;padding:6px 0;border-bottom:1px solid var(--line)}
.nok:last-child{border:0}
details summary{cursor:pointer;color:var(--gold);font-weight:600;font-size:13px}
.ajform{display:flex;flex-direction:column;gap:8px}.ajform label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}.ajform .sel{width:100%}textarea.sel{resize:vertical}
.sin-datos .ctl,.sin-datos .search,.sin-datos nav.tabs{display:none}
.welcome{max-width:760px;margin:24px auto 0;display:flex;flex-direction:column;gap:16px}
.welcome h2{font-family:var(--display);font-size:34px;text-transform:uppercase;margin:0;line-height:1}
.steps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}@media (max-width:560px){.steps{grid-template-columns:minmax(0,1fr)}}
.step{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.step b{display:block;overflow-wrap:anywhere;font-family:var(--display);font-size:18px;text-transform:uppercase;letter-spacing:.03em}
.step span{color:var(--muted);font-size:13px}
.drop{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.prog{font-size:13px;color:var(--muted);min-height:20px}
.res{display:flex;flex-direction:column;gap:6px;font-size:14px}
.res div{display:flex;gap:8px;align-items:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.view{animation:fade .25s ease-out}@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
@media (max-width:640px){header.top{position:static}.chips{flex-wrap:nowrap;overflow-x:auto;max-width:100%}.ctl{max-width:100%}.search input{width:100%}.search{flex:1 1 100%}.brand h1{font-size:18px}.kpi .val{font-size:36px}.view-h h2{font-size:25px}.hbar{grid-template-columns:90px minmax(0,1fr) 40px}}
</style>

</head><body>
<header class="top">
  <div class="wrap">
    <div class="bar">
      <div class="brand"><div class="mark">MC</div><div><h1>Matriz de <span>Habilidades</span></h1><small>CD Mercado Central · Depósito</small></div></div>
      <div class="ctl">
        <label class="sr" for="mes" hidden>Mes</label>
        <select id="mes" class="sel" aria-label="Mes de dotación"></select>
        <div class="chips" id="turnos" role="group" aria-label="Turno"></div>
      </div>
      <button class="btn" id="adm" type="button">Admin</button><div class="search"><input id="q" list="names" placeholder="Buscar persona…" aria-label="Buscar persona" autocomplete="off"><datalist id="names"></datalist></div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Secciones"></nav>
  </div>
</header>

<div class="wrap">
  <div class="note" id="estado"><span id="estado-t">Todavía no cargaste archivos en este navegador.</span><span class="spacer"></span><button class="btn solid" id="cargar" type="button">Cargar archivos</button></div>
  <main id="main"></main>
</div>
<div id="ficha-root"></div>

<script>
/* ===== Lector de Excel (.xlsx / .xlsm) sin librerías externas ===== */
const XL=(()=>{
  const td=new TextDecoder();
  async function inflate(u8){const s=new Blob([u8]).stream().pipeThrough(new DecompressionStream('deflate-raw'));return new Uint8Array(await new Response(s).arrayBuffer())}
  function unzipIndex(buf){
    const dv=new DataView(buf),u8=new Uint8Array(buf);let e=-1;
    for(let i=buf.byteLength-22;i>=Math.max(0,buf.byteLength-66000);i--){if(dv.getUint32(i,true)===0x06054b50){e=i;break}}
    if(e<0)throw new Error('No es un archivo Excel válido (.xlsx).');
    const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const files={};
    for(let k=0;k<n;k++){
      if(dv.getUint32(p,true)!==0x02014b50)break;
      const method=dv.getUint16(p+10,true),cs=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true);
      const name=td.decode(u8.subarray(p+46,p+46+nl));files[name]={method,cs,lo};p+=46+nl+xl+cl;
    }
    return {
      has:n=>!!files[n],
      async text(name){const f=files[name];if(!f)return null;const l=f.lo,nl=dv.getUint16(l+26,true),xl=dv.getUint16(l+28,true),st=l+30+nl+xl;const raw=u8.subarray(st,st+f.cs);return td.decode(f.method===0?raw:await inflate(raw))}
    };
  }
  const xml=t=>new DOMParser().parseFromString(t,'application/xml');
  const tags=(n,t)=>Array.from(n.getElementsByTagNameNS('*',t));
  const colIdx=r=>{let c=0;for(const ch of r){const x=ch.charCodeAt(0);if(x<65||x>90)break;c=c*26+(x-64)}return c-1};
  const DATE_IDS=new Set([14,15,16,17,18,19,20,21,22,27,30,36,45,46,47,50,57]);
  async function open(buf){
    const z=unzipIndex(buf);
    const wb=xml(await z.text('xl/workbook.xml')||'');
    const rels=xml(await z.text('xl/_rels/workbook.xml.rels')||'<r/>');
    const relMap={};tags(rels,'Relationship').forEach(r=>{let t=r.getAttribute('Target');t=t.startsWith('/')?t.slice(1):'xl/'+t;relMap[r.getAttribute('Id')]=t});
    const sheets=tags(wb,'sheet').map(s=>({name:s.getAttribute('name'),path:relMap[s.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id')||s.getAttribute('r:id')]}));
    let sst=null,dateStyles=null;
    async function shared(){if(sst)return sst;const t=await z.text('xl/sharedStrings.xml');sst=t?tags(xml(t),'si').map(si=>tags(si,'t').map(x=>x.textContent).join('')):[];return sst}
    async function styles(){if(dateStyles)return dateStyles;dateStyles=[];const t=await z.text('xl/styles.xml');if(!t)return dateStyles;const d=xml(t);const custom={};
      tags(d,'numFmt').forEach(f=>{const code=(f.getAttribute('formatCode')||'').replace(/"[^"]*"/g,'').replace(/\[[^\]]*\]/g,'');custom[f.getAttribute('numFmtId')]=/[dmyDMY]/.test(code)&&!/^[#0.,%\s]*$/.test(code)});
      const xfs=tags(d,'cellXfs')[0];if(xfs)tags(xfs,'xf').forEach((x,i)=>{const id=+x.getAttribute('numFmtId');dateStyles[i]=DATE_IDS.has(id)||!!custom[id]});return dateStyles}
    async function rows(sheetName){
      const sh=sheets.find(s=>s.name===sheetName);if(!sh||!sh.path)return null;
      const t=await z.text(sh.path);if(!t)return null;const d=xml(t);const ss=await shared(),ds=await styles();const out=[];
      tags(d,'row').forEach(r=>{const ri=(+r.getAttribute('r')||out.length+1)-1;const arr=[];
        tags(r,'c').forEach((c,k)=>{const ref=c.getAttribute('r');const ci=ref?colIdx(ref):k;const ty=c.getAttribute('t');const v=tags(c,'v')[0];let val=null;
          if(ty==='s')val=v?ss[+v.textContent]:null;
          else if(ty==='inlineStr')val=tags(c,'t').map(x=>x.textContent).join('');
          else if(ty==='str')val=v?v.textContent:null;
          else if(ty==='b')val=v?v.textContent==='1':null;
          else if(ty==='e')val=null;
          else if(v){const num=+v.textContent;val=ds[+(c.getAttribute('s')||0)]?new Date(Math.round((num-25569)*86400000)):num}
          arr[ci]=val});
        out[ri]=arr});

/* ---------- Charts ---------- */
function chartDot(){
  const n=DATA.months.length,W=680,H=210,pl=28,pb=24,pt=10,bw=(W-pl-4)/n;
  const rows=DATA.months.map((_,i)=>snap(i));const max=Math.ceil(Math.max(...rows.map(r=>r.EA+r.TA+r.TS))/20)*20||20;
  const y=v=>pt+(H-pt-pb)*(1-v/max);let s='';
  for(let g=0;g<=max;g+=Math.max(20,max/4)){s+=`<line x1="${pl}" x2="${W}" y1="${y(g)}" y2="${y(g)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-5}" y="${y(g)+4}" text-anchor="end">${g}</text>`}
  rows.forEach((r,i)=>{const x=pl+i*bw+1.5,w=bw-3;let acc=0;
    [['EA','var(--ok)'],['TA','var(--gold)'],['TS','var(--bad)']].forEach(([k,c])=>{const v=r[k]||0;if(!v)return;const y0=y(acc+v),h=y(acc)-y0;s+=`<rect x="${x}" y="${y0}" width="${w}" height="${h}" fill="${c}" opacity="${i===S.m?1:.55}" rx="1.5"><title>${mlong(i)} · ${k==='EA'?'Efectivos':k==='TA'?'Tempos adentro':'Tempos afuera'}: ${v}</title></rect>`;acc+=v});
    if(i%3===0||i===n-1)s+=`<text x="${x+w/2}" y="${H-7}" text-anchor="middle">${ml(i)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Dotación por mes">${s}</svg><div class="legend"><span><i style="background:var(--ok)"></i>Efectivos adentro</span><span><i style="background:var(--gold)"></i>Tempos adentro</span><span><i style="background:var(--bad)"></i>Tempos afuera</span><span>El mes elegido se ve resaltado</span></div>`;
}
function hbars(items,max,fmt=v=>v){return items.map(([l,v,extra])=>`<div class="hbar"><span>${esc(l)}</span><div class="tr"><i style="width:${max?v/max*100:0}%"></i></div><span class="num">${fmt(v)}${extra||''}</span></div>`).join('')}
function chartMov(){
  const n=DATA.months.length,W=680,H=170,pl=24,pb=24,pt=8,bw=(W-pl-4)/n;
  const c=DATA.months.map(()=>({baja:0,fin:0,efect:0,ingreso:0}));EV.forEach(e=>{if(turnoOk(e.p.t))c[e.i][e.k]++});
  const max=Math.max(4,...c.map(r=>Math.max(r.baja+r.fin,r.efect+r.ingreso)));
  const mid=pt+(H-pt-pb)/2,sc=v=>v/max*((H-pt-pb)/2);let s=`<line x1="${pl}" x2="${W}" y1="${mid}" y2="${mid}" stroke="var(--line)"/>`;
  s+=`<text x="${pl-4}" y="${pt+10}" text-anchor="end">+</text><text x="${pl-4}" y="${H-pb}" text-anchor="end">−</text>`;
  c.forEach((r,i)=>{const x=pl+i*bw+1.5,w=bw-3;let up=0,dn=0;
    [['ingreso','var(--gold)'],['efect','var(--ok)']].forEach(([k,col])=>{if(!r[k])return;const h=sc(r[k]);s+=`<rect x="${x}" y="${mid-up-h}" width="${w}" height="${h}" fill="${col}" rx="1.5"><title>${mlong(i)} · ${EVL[k][0]}: ${r[k]}</title></rect>`;up+=h});
    [['baja','var(--bad)'],['fin','var(--warn)']].forEach(([k,col])=>{if(!r[k])return;const h=sc(r[k]);s+=`<rect x="${x}" y="${mid+dn}" width="${w}" height="${h}" fill="${col}" rx="1.5"><title>${mlong(i)} · ${EVL[k][0]}: ${r[k]}</title></rect>`;dn+=h});
    if(i%3===0||i===n-1)s+=`<text x="${x+w/2}" y="${H-7}" text-anchor="middle">${ml(i)}</text>`;});
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Movimientos por mes">${s}</svg><div class="legend"><span><i style="background:var(--gold)"></i>Ingresos</span><span><i style="background:var(--ok)"></i>Efectivizados</span><span><i style="background:var(--bad)"></i>Bajas de efectivos</span><span><i style="background:var(--warn)"></i>Tempos que salieron</span></div>`;
}
const strip=(p,from=0,big=false)=>`<span class="strip${big?' big':''}">${p.h.slice(from).map((c,k)=>`<i class="${c}" title="${mlong(from+k)}: ${c==='EA'?(p.fill&&p.fill.includes(from+k)?'Efectivo (ajuste manual)':'Efectivo adentro'):c==='TA'?'Tempo adentro':c==='TS'?'Tempo afuera':'No figura'}"></i>`).join('')}</span>`;

/* ===== Cifrado (AES-GCM con clave derivada de la contraseña) ===== */
const enc=new TextEncoder(),dec=new TextDecoder();
const b64=u8=>{let s='';for(let i=0;i<u8.length;i+=32768)s+=String.fromCharCode.apply(null,u8.subarray(i,i+32768));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function gz(u8,mode){const s=new Blob([u8]).stream().pipeThrough(mode==='c'?new CompressionStream('gzip'):new DecompressionStream('gzip'));return new Uint8Array(await new Response(s).arrayBuffer())}
async function claveDe(pass,salt){const k=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function cifrar(obj,pass){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));const data=await gz(enc.encode(JSON.stringify(obj)),'c');const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},await claveDe(pass,salt),data));return {v:1,s:b64(salt),i:b64(iv),d:b64(ct)}}
async function descifrar(env,pass){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(env.i)},await claveDe(pass,unb64(env.s)),unb64(env.d));return JSON.parse(dec.decode(await gz(new Uint8Array(pt),'d')))}
async function hashAdmin(pass,salt){const h=await crypto.subtle.digest('SHA-256',enc.encode(salt+'|'+pass));return b64(new Uint8Array(h))}

  if(dl)dl.onclick=descargar;
  q$('#pb').onsubmit=async e=>{e.preventDefault();if(!REPO){descargar();return}
    const t=q$('#pb-t').value.trim();if(t)guardar('mx_gh',t);if(!leer('mx_gh')){msg('Pegá el token de GitHub o usá “Descargar datos.json”.');return}
    try{q$('#pb-go').disabled=true;msg('Cifrando datos…');const {k,payload,env}=await armar();
      msg('Subiendo a GitHub…');let sha;const g=await ghFetch('datos.json');if(g.ok)sha=(await g.json()).sha;else if(g.status===401||g.status===403)throw new Error('GitHub rechazó el token. Revisá que tenga permiso de escritura en este repositorio.');
      const content=b64(enc.encode(JSON.stringify(env)));
      const r=await ghFetch('datos.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:'Actualizar datos '+new Date().toLocaleString('es-AR'),content,sha})});
      if(!r.ok)throw new Error('No se pudo subir ('+r.status+'). '+((await r.json().catch(()=>({}))).message||''));
      listo(k,payload);msg('Publicado. Los supervisores lo ven en 1 o 2 minutos, al recargar la página.');setTimeout(()=>location.reload(),2500)}
    catch(err){msg(err.message);q$('#pb-go').disabled=false}};
}

/* ===== Inicio ===== */
q$('#cargar').onclick=()=>IS_ADMIN?openLoader():null;q$('#adm').onclick=()=>IS_ADMIN?salirAdmin():openAdmin();
(async()=>{
  IS_ADMIN=sessionStorage.getItem('mx_admin')==='1';
  try{const r=await fetch('datos.json?t='+Date.now(),{cache:'no-store'});if(r.ok)ENV=await r.json()}catch(_){}
  if(!ENV&&window.PRELOAD_RAW&&!WORK){WORK={raw:window.PRELOAD_RAW};IS_ADMIN=true}
  if(ENV){const k=leer('mx_key')||JSON.parse(sessionStorage.getItem('mx_key')||'null');
    if(k){try{PUB=await descifrar(ENV,k)}catch(_){borrar('mx_key')}}
    if(!PUB){lockScreen();return}}
  arrancar();
})();

</script>
